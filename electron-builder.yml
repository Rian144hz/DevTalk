appId: dev.devtalk.app
productName: DevTalk
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: prompts
    to: prompts
linux:
  target: [AppImage]
  category: Education
  icon: build/icon.png
  artifactName: DevTalk-${version}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: DevTalk-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
